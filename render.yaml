services:
  - type: web
    name: floodcast-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-render.txt
    startCommand: python -m server.model_api
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: OMP_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: NUMEXPR_NUM_THREADS
        value: "1"
