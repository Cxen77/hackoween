[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "floodcast-basinshift"
version = "1.0.0"
description = "River discharge forecasting (+1, +3, +7 days) with prediction intervals and flood probabilities"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<4",
  "scikit-learn>=1.5,<2",
  "joblib>=1.4,<2",
  "scipy>=1.11,<2",
  "lightgbm>=4.5,<5",
]

[project.optional-dependencies]
evaluation = ["matplotlib>=3.9,<4", "psutil>=5.9"]

[tool.setuptools]
packages = ["scripts", "server"]
